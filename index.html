<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Clientes e Vendas</title>
    <meta name="description" content="Sistema de gestão de clientes, encomendas, pagamentos, dívidas e stock com suporte a produtos digitais e físicos em Meticais (MT)." />
    <meta property="og:title" content="Gestão de Clientes e Vendas" />
    <meta property="og:description" content="Sistema de gestão de clientes, encomendas, pagamentos, dívidas e stock com suporte a produtos digitais e físicos em Meticais (MT)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Proactively check for updates on startup
            reg.update().catch(() => {});
            
            // Auto reload when a new service worker version is activated
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (!refreshing) {
                refreshing = true;
                window.location.reload();
              }
            });
          }).catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
